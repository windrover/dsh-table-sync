# 每天自动同步 DSH 插件表：
#   GitHub 清单+热度 → 仓库内 Markdown/CSV 表格 + GitHub Pages 网页 + Notion 数据库
# 触发：每天 00:00 UTC（= 北京时间 08:00）或手动运行（workflow_dispatch）。
name: dsh-table-sync

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 00:00 UTC = 北京时间 08:00
  workflow_dispatch:      # 支持在 Actions 页面手动触发

permissions:
  contents: write   # 提交更新后的表格
  pages: write      # 部署 GitHub Pages
  id-token: write

concurrency:
  group: dsh-table-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run sync
        env:
          # 高限速 PAT（推荐，5000 次/小时）。未设置时脚本走慢速兜底路径。
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          # Notion 集成令牌；未设置则跳过 Notion 同步（仓库表格仍会更新）。
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
        run: python3 sync.py

      - name: Commit updated tables
        run: |
          git config user.name 'dsh-table-sync[bot]'
          git config user.email 'dsh-table-sync[bot]@users.noreply.github.com'
          git add dsh-plugins-table.md dsh-plugins-table.csv docs/ data/heat.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: weekly plugin table sync ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

      # 已知上游竞态（actions/deploy-pages#451，2026-11 下旬明显恶化）：
      # 工件刚 finalize，紧接着查询清单可能返回 0 个，deploy 步骤随即失败。
      # 同一 run 只有一个 github-pages 工件，所以在同一 job 内退避重试是安全的
      # （重跑整个 job 反而会撞上 "Multiple artifacts named github-pages"）。
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before Pages deploy retry 1
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (retry 1)
        id: deployment_retry1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before Pages deploy retry 2
        if: ${{ steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure' }}
        run: sleep 120

      - name: Deploy to GitHub Pages (retry 2)
        if: ${{ steps.deployment.outcome == 'failure' && steps.deployment_retry1.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
